name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "backend/requirements*.txt"

      - name: Cache Hugging Face models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Cache ONNX model
        uses: actions/cache@v6
        id: cache-onnx
        with:
          path: backend/models/reranker
          key: ${{ runner.os }}-onnx-${{ hashFiles('backend/scripts/download_onnx_model.py') }}
          restore-keys: |
            ${{ runner.os }}-onnx-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-local-rerank.txt -r backend/requirements-dev.txt

      - name: Download ONNX model
        run: |
          python backend/scripts/download_onnx_model.py

      - name: Run tests
        env:
          SECRET_KEY: "ci-dummy-secret-key-at-least-32-chars-long-xyz-12345"
          ALGORITHM: "HS256"
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          REDIS_URL: "redis://localhost:6379/0"
          VOYAGE_API_KEY: "dummy-voyage-key"
          GEMINI_API_KEY: "dummy-gemini-key"
          GROQ_API_KEY: "dummy-groq-key"
          DEEPSEEK_API_KEY: "dummy-deepseek-key"
        run: |
          cd backend
          pytest -x

      - name: Build Docker image
        run: |
          docker build -t enterprise-rag-backend:latest ./backend
