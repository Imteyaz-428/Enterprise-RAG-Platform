services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_LOCAL_RERANKER: "true"
    environment:
      - RERANKER_BACKEND=local
    volumes:
      - .:/app
      - uploads:/app/uploads
    command: >
      uvicorn app:app
      --host 0.0.0.0
      --port 8000
      --reload
